<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pokemon-detail.css">
    <script src="src/pokemon-detail.js" defer></script>
    <title>Detalhes do Pokémon</title>
</head>
<body>
    <div class="detail-container">
        <div class="detail-header-top">
            <a href="index.html" class="back-button">← Voltar</a>
            <div class="id-carousel">
                <button id="prev-pokemon" class="carousel-button" type="button">←</button>
                <span id="current-page" class="carousel-label">#001</span>
                <button id="next-pokemon" class="carousel-button" type="button">→</button>
            </div>
            <div class="search-bar">
                <input id="pokemon-search" type="text" placeholder="Buscar por nome ou ID">
            </div>
        </div>

        <div class="pokemon-detail">
            <div class="detail-header">
                <img id="pokemon-image" src="" alt="">
                <div class="detail-info">
                    <h1 id="pokemon-name"></h1>
                    <p class="pokemon-id" id="pokemon-id"></p>
                    <div class="types-container" id="types-container"></div>
                </div>
            </div>

            <div class="detail-body">
                <section class="detail-section">
                    <h2>Medidas</h2>
                    <div class="measures">
                        <div class="measure-item">
                            <span class="label">Altura</span>
                            <span class="value" id="height"></span>
                        </div>
                        <div class="measure-item">
                            <span class="label">Peso</span>
                            <span class="value" id="weight"></span>
                        </div>
                    </div>
                </section>

                <section class="detail-section">
                    <h2>Estatísticas</h2>
                    <div id="stats-container"></div>
                </section>

                <section class="detail-section">
                    <h2>Habilidades</h2>
                    <div id="abilities-container" class="abilities-container"></div>
                </section>
            </div>
        </div>
    </div>

    <div class="chatbot-widget">
        <button class="chatbot-button" type="button">IA</button>
        <div class="chatbot-panel">
            <div class="chatbot-panel-header">
                <span>Chat IA</span>
                <button class="chatbot-close" type="button">×</button>
            </div>
            <div class="chatbot-messages">
                <div class="chatbot-message assistant">Clique no botão e pergunte algo sobre o Pokémon atual.</div>
            </div>
            <div class="chatbot-status"></div>
            <div class="chatbot-input-row">
                <input id="chat-input" type="text" placeholder="Digite sua pergunta...">
                <button id="chat-send" type="button">Enviar</button>
            </div>
        </div>
    </div>
</body>
</html>
